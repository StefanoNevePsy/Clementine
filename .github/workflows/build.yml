name: Build macOS app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Bundle ffmpeg (static, Apple silicon)
        continue-on-error: true
        run: |
          curl -fsSL -o ffmpeg.zip "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip"
          unzip -o ffmpeg.zip -d ffmpeg-dl
          mv ffmpeg-dl/ffmpeg Resources/ffmpeg
          chmod +x Resources/ffmpeg
          Resources/ffmpeg -version | head -1

      - name: Build
        env:
          VERSION: 1.0.${{ github.run_number }}
        run: |
          chmod +x build-app.sh
          ./build-app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Clementine
          path: dist/Clementine.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Clementine 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Scarica **Clementine.zip**, decomprimi e trascina Clementine.app in Applicazioni.
            Al primo avvio: tasto destro sull'app → Apri → Apri.
            La guida rapida è in **Guida-Clementine.pdf**.
          files: |
            dist/Clementine.zip
            docs/Guida-Clementine.pdf
